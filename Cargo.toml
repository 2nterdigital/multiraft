[workspace]
resolver = "2"
members = [
  "crates/multiraft-fsm",
  "crates/multiraft-store",
  "crates/multiraft-net",
  "crates/multiraft-core",
  "crates/multiraft-demo",
  "crates/multiraft-slot",
  "crates/multiraft-slot-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
openraft = { git = "https://github.com/2nterdigital/openraft.git", rev = "b5f3dc1a4df74891d4a8236b9b35af90158dbb52", version = "=0.10.1", default-features = false, features = ["serde", "type-alias", "tokio-rt"] }
openraft-multi = { git = "https://github.com/2nterdigital/openraft.git", rev = "b5f3dc1a4df74891d4a8236b9b35af90158dbb52", version = "=0.10.1" }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

tower = "0.4.13"
